<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>save2grow</title>
    <!-- GAPING typography (spec 004, criterion 6): Space Grotesk for headings, Inter for body,
         loaded from Google Fonts — no npm dependency. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&family=Inter:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="icon" type="image/svg+xml" href="assets/logo.svg" />
  </head>
  <body id="app">
    <header class="page-header">
      <img src="assets/logo.svg" alt="" width="28" height="28" class="page-logo" />
      <h1>save2grow</h1>
    </header>

    <section id="login-section">
      <form id="login-form">
        <label for="email-input">Email</label>
        <input id="email-input" type="email" required autocomplete="email" />
        <button type="submit">Enviar enlace</button>
      </form>
      <p id="login-message"></p>
    </section>

    <section id="feed-section" hidden>
      <div class="feed-topbar">
        <nav id="tabs" class="tabs" aria-label="Filtrar por estado"></nav>
        <button id="logout-button" type="button" class="link-button">Cerrar sesión</button>
      </div>
      <ul id="feed-list" class="feed-list"></ul>
      <p id="empty-state" class="empty-state" hidden>Nada por aquí todavía.</p>
    </section>

    <!-- Supabase's JS client from a CDN, not bundled — zero npm dependencies, same pattern as
         the rest of this repo (decisions.md, 2026-10-25). Pinned version, well over two weeks
         old. -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
    <script type="module" src="js/app.js"></script>
  </body>
</html>
